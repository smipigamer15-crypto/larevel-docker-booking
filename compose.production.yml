name: booking-production

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to the published PHP image}
  restart: unless-stopped
  env_file:
    - ./app.env
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_MAINTENANCE_DRIVER: file
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: '3306'
    DB_DATABASE: ${DOCKER_DB_DATABASE:-booking_db}
    DB_USERNAME: ${DOCKER_DB_USER:-booking_user}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD}
    LOG_CHANNEL: stderr
  volumes:
    - storage:/var/www/html/storage
    - uploads:/var/www/html/public/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app

  queue:
    <<: *app
    user: www-data
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=90]
    stop_grace_period: 120s

  scheduler:
    <<: *app
    user: www-data
    command: [php, artisan, schedule:work]
    stop_grace_period: 120s

  webserver:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the published Nginx image}
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80'
    volumes:
      - storage:/var/www/html/storage:ro
      - uploads:/var/www/html/public/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-booking_db}
      MYSQL_USER: ${DOCKER_DB_USER:-booking_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql:
  storage:
  uploads:
