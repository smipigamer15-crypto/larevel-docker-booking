name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Workflow and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        run: >-
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci-cd.yml
      - name: Check deployment shell scripts
        run: >-
          docker run --rm --entrypoint shellcheck -v "$PWD:/workspace:ro"
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          /workspace/docker/production/deploy.sh /workspace/docker/production/entrypoint.sh
          /workspace/docker/production/tests/deploy.test.sh
      - name: Verify deployment success and failure handling
        run: bash docker/production/tests/deploy.test.sh

  backend:
    name: Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --env=testing
      - run: vendor/bin/phpunit --configuration=phpunit.dist.xml --colors=always

  frontend:
    name: Frontend tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: node --test tests/Frontend/*.test.mjs
      - run: npm run build

  images:
    name: Build production images
    needs: [infrastructure, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.names.outputs.app }}@${{ steps.app.outputs.digest }}
      web: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image names
        id: names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "app=ghcr.io/${repository}-app" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PHP image
        id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          target: app
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.names.outputs.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app
      - name: Build Nginx image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          target: web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web

  deploy:
    name: Deploy without SSH
    needs: images
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, booking-production]
    timeout-minutes: 20
    concurrency:
      group: booking-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/opt/booking-system' }}
      APP_IMAGE: ${{ needs.images.outputs.app }}
      WEB_IMAGE: ${{ needs.images.outputs.web }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Isolate registry credentials for this deployment
        shell: bash
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/booking-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy exact images that passed CI
        shell: bash
        run: bash docker/production/deploy.sh
